name: Synera CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  foundation:
    name: Foundation CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: foundation
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Deployment placeholder
        run: echo "Deployment would run here after successful build and typecheck on main push"